[project]
name = "samsung-tv-mcp"
version = "1.1.0"
description = "MCP server for Samsung Smart TV control via local network"
requires-python = ">=3.10"
dependencies = [
    "samsungtvws[encrypted]>=2.7.0",
    "mcp[cli]>=1.0.0,<2",  # main.py uses FastMCP, renamed in mcp 2.x
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Flat layout (no package dir), so list the shipped files explicitly
only-include = ["main.py", "tv.py", "remote.py", "remote.html", "remote.webmanifest", "remote-icon.svg", "remote-icon-180.png", "remote-icon-512.png"]
